version: '3.8'

networks:
  rockwillow_network:
    name: rockwillow_network
    external: true

services:
  rw-app-budget:
    build:
      context: ${HOME}/projects/rw_budget
      dockerfile: Dockerfile
    container_name: rw-app-budget
    restart: unless-stopped
    networks:
      - rockwillow_network
    environment:
      PYTHONUNBUFFERED: 1
      FLASK_ENV: production
      LOG_LEVEL: INFO
      LOG_DIR: /app/logs
      UPLOAD_DIR: /app/uploads
      CACHE_DIR: /app/cache
      TMP_DIR: /app/tmp
      DATABASE_URL: mysql://${DB_USER}:${DB_PASSWORD}@rw-mariadb:3306/${DB_NAME}
      SECRET_KEY: ${FLASK_SECRET_KEY}
      # Add app-specific environment variables
    volumes:
      - ${HOME}/data/apps/rw_budget/logs:/app/logs:Z,U
      - ${HOME}/data/apps/rw_budget/uploads:/app/uploads:Z,U
      - ${HOME}/data/apps/rw_budget/tmp:/app/tmp:Z,U
      - ${HOME}/data/apps/rw_budget/cache:/app/cache:Z,U
      # 6. Optional: Mount .env file (READ ONLY)
      - ${HOME}/projects/rw_deploy/.env:/app/.env:ro

  # ==================== GIN API ====================
  rw-app-budget-api:
    build:
      context: ${HOME}/projects/rw_budget_api
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - rockwillow_network
    container_name: rw-app-budget-api
    expose:
      - "8080"
    environment:
      GIN_MODE: release
      APP_PORT: 8080
      DB_HOST: rw-mariadb
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      MSQLPWD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s